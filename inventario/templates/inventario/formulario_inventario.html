 <form method="post">
    {% csrf_token %}

        <!-- PROVEEDOR -->
        <div class="section-box mb-4">
            <h6 class="section-title">Proveedor</h6>
            <div class="row g-3">
                <div class="col-md-6">
                    <select name="proveedor" class="form-select" required>
                        {% for p in proveedores %}
                        <option value="{{ p.id }}">{{ p.nombre_proveedor }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <input type="date" name="fecha" class="form-control" required>
                </div>
            </div>
        </div>

        <!-- PRODUCTOS -->
        <div class="section-box mb-4">
            <h6 class="section-title">Productos recibidos</h6>
            <div class="row g-3">
                <div class="col-md-5">
                    <select name="producto[]" class="form-select" required>
                        {% for prod in productos %}
                        <option value="{{ prod.codigo }}">{{ prod.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-3">
                    <input type="number" name="cantidad[]" class="form-control" min="1" required>
                </div>

                <div class="col-md-4">
                    <input type="number" name="precio_total" class="form-control" required>
                </div>
            </div>
        </div>

        <!-- REPARTIDOR -->
        <div class="section-box mb-4">
            <h6 class="section-title">Datos del repartidor</h6>
            <div class="row g-3">
                <input class="form-control col" name="nombre_repartidor" placeholder="Nombre" required>
                <input class="form-control col" name="apellido_repartidor" placeholder="Apellido" required>
                <input class="form-control col" name="cedula_repartidor" placeholder="Cédula" required>
                <input class="form-control col" name="telefono_repartidor" placeholder="Teléfono" required>
            </div>
        </div>

        <!-- VEHÍCULO -->
        <div class="section-box mb-4">
            <h6 class="section-title">Vehículo</h6>
            <div class="row g-3">
                <input class="form-control col-md-6" name="placa_vehiculo" placeholder="Placa" required>
                <input class="form-control col-md-6" name="tipo_vehiculo" placeholder="Tipo" required>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-3">
            <a href="{% url 'inventario:inventario_vista' %}" class="btn btn-outline-secondary">
                Cancelar
            </a>
            <button class="btn btn-dark px-4">
                Guardar inventario
            </button>
        </div>

    </form>
