{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificar código | MONA KERATINA</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #1f1918;
            --secondary-brown: #3b2f2f;
            --accent-cream: #f5f0e0;
            --text-main: #3b2f2f;
        }

        body, html {
            margin: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, #0e0806 0%, #1c120d 20%, #4a2e1f 45%, #3b2f2f 85%, #120b08 100%);
        }

        .split {
            display: flex;
            height: 100vh;
        }

        .left {
            flex: 1.2;
            background: linear-gradient(135deg, #3b2f2f, #6d5c5c);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f0e0;
        }

        .left img {
            width: 320px;
        }

        .left h3 {
            color: #f5f0e0;
        }

        .left p {
            color: #cda89b;
        }

        .right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f0e0;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            color: #3b2f2f;
        }

        h2 {
            color: #3b2f2f;
            font-size: 1.6rem;
        }

        p {
            color: #6d5c5c;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #ddd;
            margin: 15px 0;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--secondary-brown);
            box-shadow: 0 0 0 3px rgba(109, 92, 92, 0.1);
            background-color: #fefdfb;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1f1918, #3b2f2f);
            color: #f5f0e0;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 47, 47, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 47, 47, 0.4);
        }

        .alert {
            background: #fff3cd;
            border-left: 5px solid #6d5c5c;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            color: #856404;
        }

        @media (max-width: 992px) {
            .left { display: none; }
            .right { justify-content: flex-start; padding-top: 40px; }
        }
    </style>
</head>

<body>

<div class="split">

    <div class="left">
        <img src="{% static 'logo1..png' %}">
        <h3 style="margin-top:30px; font-size: 24px;">MONA KERATINA</h3>
        <p>Verificación segura</p>
    </div>

    <div class="right">
        <div class="box">
            <h1>MONA KERATINA</h1>
            <h2>Verificar código</h2>
            <p>Ingresa el código enviado a tu correo.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <input type="text" name="codigo" placeholder="Código de 6 dígitos" required>
                <button>Verificar</button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
