<!-- Widget CAPTCHA estilo Google reCAPTCHA — 100% Django -->
<div class="recaptcha-box" id="recaptchaBox">
  <!-- Lado izquierdo: checkbox + texto -->
  <div class="recaptcha-left">
    <div class="recaptcha-checkbox-wrap" id="captchaCheckWrap">
      <div class="recaptcha-checkbox" id="captchaCheck">
        <svg class="checkmark-svg" viewBox="0 0 24 24" fill="none">
          <polyline points="4 12 10 18 20 6" stroke="#4caf50" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="spinner-ring"></div>
      </div>
    </div>
    <span class="recaptcha-label">No soy un robot</span>
  </div>

  <!-- Lado derecho: ícono shield -->
  <div class="recaptcha-right">
    <svg class="shield-icon" viewBox="0 0 40 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 2L4 10V22C4 33.1 10.84 43.36 20 46C29.16 43.36 36 33.1 36 22V10L20 2Z"
            fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1.5"/>
      <path d="M20 6L8 12.5V22C8 31 13.6 39.4 20 42C26.4 39.4 32 31 32 22V12.5L20 6Z"
            fill="#f5f5f5"/>
      <path d="M17 24L20 27L27 18" stroke="#9e9e9e" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="recaptcha-brand">
      <span class="recaptcha-brand-name">Seguridad</span>
      <span class="recaptcha-brand-terms">MONA Keratina</span>
    </div>
  </div>

  <!-- Campos ocultos del widget Django -->
  {% for widget in widget.subwidgets %}
    {% include widget.template_name %}
  {% endfor %}
</div>

<!-- ═══ OVERLAY DESAFÍO DE IMÁGENES — Estilo Google reCAPTCHA ═══ -->
<div class="captcha-challenge-overlay" id="captchaChallengeOverlay">
  <div class="captcha-challenge-panel">

    <!-- HEADER AZUL (estilo Google) -->
    <div class="challenge-header-google">
      <div class="challenge-header-text">
        <span class="challenge-instruction" id="challengeInstruction">Selecciona todas las imágenes con</span>
        <span class="challenge-target" id="challengeTarget">semáforos</span>
        <span class="challenge-subtext" id="challengeSubtext">Haz clic en verificar cuando no quede ninguna.</span>
      </div>
      <div class="challenge-header-icon">
        <i class="bi bi-arrow-clockwise" id="challengeReload" title="Nuevo desafío"></i>
      </div>
    </div>

    <!-- GRID 3×3 -->
    <div class="challenge-grid-google" id="challengeGrid">
      <!-- 9 tiles generadas por JS -->
    </div>

    <!-- FOOTER con botón VERIFICAR -->
    <div class="challenge-footer-google">
      <span class="challenge-error" id="challengeError"></span>
      <button type="button" class="challenge-btn-verify-google" id="challengeVerify" disabled>VERIFICAR</button>
    </div>

  </div>
</div>
