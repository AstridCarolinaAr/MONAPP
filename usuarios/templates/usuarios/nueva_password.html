{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva contraseña | MONA KERATINA</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'usuarios/css/auth-forms.css' %}">
</head>

<body>

<div class="split">

    <div class="left">
        <img src="{% static 'logo1..png' %}" alt="MONA KERATINA">
        <h3 style="margin-top:30px; font-size: 24px; color: #f5f0e0;">MONA KERATINA</h3>
        <p style="color: #cda89b;">Seguridad en tu cuenta</p>
    </div>

    <div class="right">
        <div class="box">
            <h1>MONA KERATINA</h1>
            <h2>Nueva contraseña</h2>
            <p>Ingresa tu nueva contraseña.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <input type="password" name="password1" placeholder="Nueva contraseña" required>
                <input type="password" name="password2" placeholder="Confirmar contraseña" required>
                <button>Guardar contraseña</button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
