<!-- Contenido simplificado del modal para crear gestión de datos -->
<div class="container-fluid">
    <form method="post" enctype="multipart/form-data" id="formGestionDatosModal">
        {% csrf_token %}
        
        {% if form.non_field_errors %}
            <div class="alert alert-danger">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <!-- Nota: Este es un formulario simplificado para modal -->
        <!-- Para el formulario completo, redirija a la vista normal -->
        
        <div class="mb-3">
            <label for="{{ form.cliente.id_for_label }}" class="form-label">{{ form.cliente.label }}</label>
            {{ form.cliente }}
        </div>

        <div class="mb-3">
            <label for="{{ form.procedimiento_realizado_por.id_for_label }}" class="form-label">{{ form.procedimiento_realizado_por.label }}</label>
            {{ form.procedimiento_realizado_por }}
        </div>

        <div class="mb-3">
            <label for="{{ form.tipo_tratamiento.id_for_label }}" class="form-label">{{ form.tipo_tratamiento.label }}</label>
            {{ form.tipo_tratamiento }}
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="{{ form.precio_servicio.id_for_label }}" class="form-label">{{ form.precio_servicio.label }}</label>
                {{ form.precio_servicio }}
            </div>
            <div class="col-md-6">
                <label for="{{ form.anticipo_cliente.id_for_label }}" class="form-label">{{ form.anticipo_cliente.label }}</label>
                {{ form.anticipo_cliente }}
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> Guardar
        </button>
    </form>
</div>
