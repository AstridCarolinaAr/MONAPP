{% extends 'core/panel_admin_base.html' %}
{% load static %}
{% load humanize %}

{% block title %}Gestion de datos{% endblock %}

{% block page_title %}
    <i class="bi bi-file-earmark-text"></i> Gestion de datos
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'servicios/css/estilos.css' %}">
<style>
    /* Estilos para el modal grande */
    .modal-fullscreen-custom {
        max-width: 600px;
        width: 70vw;
        min-width: 320px;
        margin: auto;
        border-radius: 18px;
        padding: 0;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1060;
    }
    .modal-content {
        border-radius: 18px;
        margin: 0;
        padding: 0;
        max-height: 85vh !important;
        height: auto !important;
    }
    .modal-body {
        padding: 0.5rem !important;
        max-height: 75vh;
        overflow-y: auto;
    }
    
    .section-title {
        background-color: #f8f9fa;
        padding: 10px 15px;
        margin-top: 20px;
        margin-bottom: 15px;
        border-left: 4px solid #634c40;
        font-weight: bold;
    }
    
    .conditional-field {
        display: none;
        margin-top: 10px;
    }
    
    .conditional-field.show {
        display: block;
    }
    
    .checkbox-group {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
    }
    
    /* Estilos para navegación por pasos */
    .form-step {
        display: none;
    }
    
    .form-step.active {
        display: block;
    }
    
    .progress-steps {
        display: flex;
        justify-content: space-between;
        margin-bottom: 30px;
        position: relative;
    }
    
    .progress-steps::before {
        content: '';
        position: absolute;
        top: 20px;
        left: 0;
        right: 0;
        height: 2px;
        background-color: #dee2e6;
        z-index: 0;
    }
    
    .step-item {
        flex: 1;
        text-align: center;
        position: relative;
        z-index: 1;
    }
    
    .step-circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: #dee2e6;
        color: #6c757d;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 10px;
        font-weight: bold;
        transition: all 0.3s;
    }
    
    .step-item.active .step-circle {
        background-color: #634c40;
        color: white;
    }
    
    .step-item.completed .step-circle {
        background-color: #382a23;
        color: white;
    }
    
    .step-label {
        font-size: 14px;
        color: #6c757d;
    }
    
    .step-item.active .step-label {
        color: #634c40;
        font-weight: bold;
    }
    
    .modal-body-scrollable {
        max-height: 70vh;
        overflow-y: auto;
    }
    
    /* Estilos compactos para header y footer */
    .modal-header {
        padding: 1rem !important;
    }
    .modal-footer {
        padding: 0.75rem !important;
    }
</style>
<style>
    /* Fondo del overlay del modal más oscuro y translúcido */
    .modal-backdrop.show {
        background-color: rgba(0, 0, 0, 0.3) !important;
        opacity: 1 !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        backdrop-filter: blur(5px) !important;
    }
    
    /* Efecto blur en el contenido de fondo */
    body.modal-open > *:not(.modal) {
        filter: blur(2px);
    }
</style>
{% endblock %}

{% block content %}
<!-- Este archivo no se utiliza - el modal está en lista_gestion_alisados.html -->
{% endblock %}

{% block extra_js %}
{% endblock %}
