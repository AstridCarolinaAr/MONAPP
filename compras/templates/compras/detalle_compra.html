<div class="row g-3 mb-3">
  <div class="col-md-6"><strong>Fecha:</strong> {{ c.fecha }}</div>
  <div class="col-md-6"><strong>Proveedor:</strong> {{ c.proveedor }}</div>


  <div class="col-md-6"><strong>Usuario:</strong> {{ c.usuario.username }}</div>
  <div class="col-md-6"><strong>Total:</strong> ${{ c.precio_total|floatformat:2 }}</div>
</div>

<hr>

<h6 class="mb-2">Productos</h6>

<div class="table-responsive">
  <table class="table table-sm align-middle">
    <thead>
      <tr>
        <th>Producto</th>
        <th class="text-end">Cantidad</th>
        <th class="text-end">Precio Unitario</th>
      </tr>
    </thead>
    <tbody>
      {% for d in c.detalles.all %}
      <tr>
        <td>{{ d.producto.nombre }}</td>
        <td class="text-end">{{ d.cantidad }}</td>
        <td class="text-end">${{ d.precio_unitario|floatformat:2 }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
